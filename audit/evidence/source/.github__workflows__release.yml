1: # Generates and uploads an image of Robotics Academy and Robotics Academy database using the desired tag and branches
2: name: Release new Robotics Academy Version on new version
3: 
4: on:
5:   release:
6:     types: [published]
7: 
8: jobs:
9:   generate-RA-docker-image:
10:     name: Generate Robotics Academy Image
11:     runs-on: ubuntu-latest
12:     env:
13:       TAG: ${{ github.event.release.tag_name }}
14:     steps:
15:       - name: Save the version tag
16:         run: echo "TAG=${TAG#v}" >> $GITHUB_ENV
17:       - run: echo ${TAG}
18:       - name: Check out the repo
19:         uses: actions/checkout@v3
20:         with:
21:           ref: ${{ github.event.inputs.branch-webserver-id }}
22:           fetch-depth: 1
23: 
24:       - name: Set up QEMU
25:         uses: docker/setup-qemu-action@v3
26: 
27:       - name: Set up Docker Buildx
28:         uses: docker/setup-buildx-action@v3
29: 
30:       - name: Login to DockerHub
31:         uses: docker/login-action@v3
32:         with:
33:           username: ${{ secrets.DOCKER_USERNAME }}
34:           password: ${{ secrets.DOCKER_PASSWORD }}
35: 
36:       - name: Build base image
37:         run: |
38:           sudo apt-get update
39:           cd scripts/RADI
40:           docker build --build-arg TARGETARCH=amd64 -f Dockerfile.dependencies_humble -t jderobot/robotics-applications:dependencies-humble .
41: 
42:       - name: Build and push RADI
43:         run: |
44:           cd scripts/RADI
45:           docker build --no-cache -f Dockerfile.humble \
46:             --build-arg ROBOTICS_ACADEMY=humble-devel\
47:             --build-arg ROBOTICS_INFRASTRUCTURE=humble-devel \
48:             --build-arg RAM=humble-devel \
49:             --build-arg ROS_DISTRO=humble \
50:             --build-arg IMAGE_TAG=${TAG} \
51:             --build-arg ACADEMY_OWNER=JdeRobot \
52:             --build-arg INFRA_OWNER=JdeRobot \
53:             -t jderobot/robotics-academy:${TAG} .
54:           docker push jderobot/robotics-academy:${TAG}
55: 
56:       - name: Upload as Latest
57:         run: |
58:           docker image tag jderobot/robotics-academy:${TAG} jderobot/robotics-academy:latest
59:           docker push jderobot/robotics-academy:latest
60: 
61:   generate-RA-database-docker-image:
62:     name: Generate Robotics Academy Database Image
63:     runs-on: ubuntu-latest
64:     env:
65:       TAG: ${{ github.event.release.tag_name }}
66:     steps:
67:       - name: Save the version tag
68:         run: echo "TAG=${TAG#v}" >> $GITHUB_ENV
69:       - run: echo ${TAG}
70:       - name: Check out the repo
71:         uses: actions/checkout@v3
72:         with:
73:           ref: ${{ github.event.inputs.branch-webserver-id }}
74:           fetch-depth: 1
75: 
76:       - name: Set up QEMU
77:         uses: docker/setup-qemu-action@v3
78: 
79:       - name: Set up Docker Buildx
80:         uses: docker/setup-buildx-action@v3
81: 
82:       - name: Login to DockerHub
83:         uses: docker/login-action@v3
84:         with:
85:           username: ${{ secrets.DOCKER_USERNAME }}
86:           password: ${{ secrets.DOCKER_PASSWORD }}
87: 
88:       - name: Build and push RA database
89:         run: |
90:           cd scripts/RADI
91:           docker build --no-cache -f Dockerfile.database \
92:             --build-arg IMAGE_TAG=${TAG}\
93:             --build-arg ROBOTICS_ACADEMY=humble-devel\
94:             --build-arg ROBOTICS_INFRASTRUCTURE=database \
95:             --build-arg ACADEMY_OWNER=JdeRobot \
96:             --build-arg INFRA_OWNER=JdeRobot \
97:             -t jderobot/robotics-database:${TAG} .
98:           docker push jderobot/robotics-database:${TAG}
99: 
100:       - name: Upload as Latest
101:         run: |
102:           docker image tag jderobot/robotics-database:${TAG} jderobot/robotics-database:latest
103:           docker push jderobot/robotics-database:latest
