1: # Generates and uploads an image of Robotics-Academy using the desired tag and branches
2: name: Generate tagged RoboticsAcademy image
3: 
4: on:
5:     workflow_call:
6:         inputs:
7:             tag:
8:                 description: "Docker Image Tag"
9:                 required: true
10:                 default: test
11:                 type: string
12:             latest:
13:                 description: "Upload as latest"
14:                 required: true
15:                 default: false
16:                 type: boolean
17:             RA:
18:                 description: "Branch of RoboticsAcademy"
19:                 required: true
20:                 default: humble-devel
21:                 type: string
22:             RI:
23:                 description: "Branch of Robotics Infrastructure"
24:                 required: true
25:                 default: humble-devel
26:                 type: string
27:             RAM:
28:                 description: "Branch of Robotics Application Manager"
29:                 required: true
30:                 default: humble-devel
31:                 type: string
32:             ROS:
33:                 description: "ROS Distro (humble)"
34:                 required: true
35:                 default: humble
36:                 type: string
37:     workflow_dispatch:
38:         inputs:
39:             tag:
40:                 description: "Docker Image Tag"
41:                 required: true
42:                 default: test
43:                 type: string
44:             latest:
45:                 description: "Upload as latest"
46:                 required: true
47:                 default: false
48:                 type: boolean
49:             RA:
50:                 description: "Branch of RoboticsAcademy"
51:                 required: true
52:                 default: humble-devel
53:                 type: string
54:             RI:
55:                 description: "Branch of Robotics Infrastructure"
56:                 required: true
57:                 default: humble-devel
58:                 type: string
59:             RAM:
60:                 description: "Branch of Robotics Application Manager"
61:                 required: true
62:                 default: humble-devel
63:                 type: string
64:             ROS:
65:                 description: "ROS Distro (humble)"
66:                 required: true
67:                 default: humble
68:                 type: string
69: 
70: jobs:
71:     push_to_registry:
72:         name: Run Test and Update Docker Image
73:         runs-on: ubuntu-latest
74:         env:
75:             TAG: ${{ github.event.inputs.tag }}
76:         steps:
77:             - name: Cleaning Github runner
78:               uses: mathio/gha-cleanup@v1
79:               with:
80:                   remove-browsers: true
81:                   verbose: true
82:             - name: Save the version tag
83:               run: echo "TAG=${TAG#v}" >> $GITHUB_ENV
84:             - run: echo ${TAG}
85:             - name: Check out the repo # checking our the code at current commit that triggers the workflow
86:               uses: actions/checkout@v3
87:               with:
88:                   ref: ${{ github.event.inputs.RA }}
89:                   fetch-depth: 1
90: 
91:             - name: Set up QEMU
92:               uses: docker/setup-qemu-action@v3
93: 
94:             - name: Set up Docker Buildx
95:               uses: docker/setup-buildx-action@v3
96: 
97:             - name: Login to DockerHub
98:               uses: docker/login-action@v3
99:               with:
100:                   username: ${{ secrets.DOCKER_USERNAME }}
101:                   password: ${{ secrets.DOCKER_PASSWORD }}
102:             - name: Build RADI
103:               run: |
104:                   cd scripts/RADI
105:                   docker build --build-arg TARGETARCH=amd64 -f Dockerfile.dependencies_humble -t jderobot/robotics-applications:dependencies-humble .
106:                   docker build --no-cache -f Dockerfile.humble \
107:                     --build-arg ROBOTICS_ACADEMY=${{ github.event.inputs.RA }}\
108:                     --build-arg ROBOTICS_INFRASTRUCTURE=${{ github.event.inputs.RI }} \
109:                     --build-arg RAM=${{ github.event.inputs.RAM }} \
110:                     --build-arg ROS_DISTRO=${{ github.event.inputs.ROS }} \
111:                     --build-arg IMAGE_TAG=${TAG} \
112:                     --build-arg ACADEMY_OWNER=JdeRobot \
113:                     --build-arg INFRA_OWNER=JdeRobot \
114:                     -t jderobot/robotics-academy:${TAG} .
115:             - name: Push RADI
116:               run: |
117:                   docker push jderobot/robotics-academy:${TAG}
118:             - name: Upload as Latest
119:               if: ${{ inputs.latest }}
120:               run: |
121:                   docker image tag jderobot/robotics-academy:${TAG} jderobot/robotics-academy:latest
122:                   docker push jderobot/robotics-academy:latest
